---
layout: base
js:
- /assets/js/table-of-contents.js
---
<style>
    :root {
        --body-max-width: var(--navbar-max-width);
    }
</style>

<article>
    <div id="contents">
        <h1>{{ title }}</h1>
        <hr>
        <div class="article-metadata">
            <p><i class="ti ti-user"></i> {{ author }}</p>
            <p><i class="ti ti-clock"></i> {{ date | date: "%B %d, %Y", 0 }}</p>
            <p><i class="ti ti-folder"></i> {{ primaryCategory }}</p>
        </div>
        <div class="article-buttons">
            <button type="button" id="share-button">
                Share <i class="ti ti-share"></i>
            </button>
            <a class="button" href="https://patreon.com/JonCorey" target="_blank" rel="noopener noreferrer" aria-label="Support on Patreon">
                <i class="ti ti-brand-patreon"></i>
            </a>
        </div>
        <hr>
        {{ content }}
        <hr>
        <p class="article-cta">Love the article and want to say thanks? Consider supporting me on <a href="https://patreon.com/JonCorey" target="_blank" rel="noopener noreferrer">Patreon</a>.</p>
    </div>
    <aside id="table-of-contents"></aside>
</article>

<script>
(() => {
    const headings = document.querySelectorAll("#contents h2, #contents h3, #contents h4, #contents h5, #contents h6");
    headings.forEach(function(heading) {
        if (!heading.id) return;
        heading.classList.add("heading-hover");
        const link = document.createElement("a");
        link.href = "#" + heading.id;
        link.className = "heading-link";
        link.setAttribute("aria-label", "Link to this section");
        link.innerHTML = '<i class="ti ti-link"></i>';
        heading.appendChild(link);
    });
})();
</script>
