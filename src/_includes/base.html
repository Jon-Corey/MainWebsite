<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/logo-16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo-32.png">
        <link rel="icon" type="image/svg+xml" sizes="all" href="/assets/images/logo.svg">
        <link rel="apple-touch-icon" href="/assets/images/logo-180.png">

        {% for file in css %}
            <link rel="stylesheet" href="{{ file }}">
        {% endfor %}
        <link rel="stylesheet" href="/assets/css/tabler-icons.min.css">
        <link rel="stylesheet" href="/assets/css/prism-theme.css">
        <link rel="stylesheet" href="/assets/css/site.css">

        <script src="/assets/js/initialize-theme.js"></script>

        <script defer src="https://cloud.umami.is/script.js" data-website-id="f1839982-8e2a-4a23-95be-6e0bced26957" data-domains="joncorey.dev"></script>

        <title>{{ title }}</title>
        <meta name="description" content="{{ description }}">
    </head>
    <body>
        <header id="navbar">
            <nav class="navbar-container">
                <a href="/" class="home-link">
                    <img src="/assets/images/logo.svg" class="navbar-logo" alt="">
                    <h1>JonCorey.Dev</h1>
                </a>
                <button type="button" id="navbar-toggle" aria-controls="navbar-menu" aria-label="Toggle menu" aria-expanded="false">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <div id="navbar-menu" aria-labelledby="navbar-toggle">
                    <ul class="navbar-links">
                        <li class="navbar-item"><a class="navbar-link" href="/projects">Projects</a></li>
                        {% if collections.blog.size > 0 %}
                        <li class="navbar-item"><a class="navbar-link" href="/blog">Blog</a></li>
                        {% endif %}
                        <li class="navbar-item">
                            <button type="button" id="theme-toggle" aria-label="Toggle theme">
                                <i class="icon-light ti ti-sun"></i>
                                <i class="icon-dark ti ti-moon"></i>
                                <span class="small-only">Toggle theme</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            {{ content }}
        </main>

        <footer>
            <hr>
            <span>&copy; JonCorey.Dev {{ "now" | date: "%Y" }}</span>
            <div class="footer-links">
                <a href="/privacy-policy">Privacy Policy</a>
            </div>
        </footer>

        <script src="/assets/js/app.js"></script>
        {% for file in js %}
            <script src="{{ file }}"></script>
        {% endfor %}
    </body>
</html>
