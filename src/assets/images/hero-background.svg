            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#000" />
        </radialGradient>
        <mask id="grid-mask">
            <rect width="100%" height="100%" fill="url(#grid-gradient)" />
        </mask>
        <pattern id="grid" patternUnits="userSpaceOnUse" width="27.8" height="27.8" patternTransform="translate(0.3 -0.7)">
            <path d="M0 27.8 V0 H27.8" fill="none" stroke="#fff" stroke-width="1" />
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" mask="url(#grid-mask)" opacity="0.4" />
</svg>